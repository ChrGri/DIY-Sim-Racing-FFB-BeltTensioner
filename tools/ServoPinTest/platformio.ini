; Standalone test sketch: set the servo pins of the ControlBoard V7 to fixed levels.
; Open this folder (tools/ServoPinTest) in PlatformIO, then Upload and Monitor.

[platformio]
default_envs = ControlBoard_V7

[env:ControlBoard_V7]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-s3-devkitc-1
; ESP32-S3-Zero: 4 MB flash (the devkitc-1 default of 8 MB does not boot on it)
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
; Native USB (TinyUSB) only sends to the PC while DTR is set; RTS low = no reset
monitor_dtr = 1
monitor_rts = 0
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	'-DUSB_PRODUCT="servo_pin_test"'
	-DCORE_DEBUG_LEVEL=0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
