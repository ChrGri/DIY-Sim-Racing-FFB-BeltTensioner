[env:ControlBoard_V7]
board = esp32-s3-devkitc-1
; ESP32-S3-Zero: 4 MB flash (the devkitc-1 default of 8 MB does not boot on it)
board_upload.flash_size = 4MB
board_build.partitions = partition_4M_customized.csv
upload_protocol = esptool
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags = 
	-O3
	-DPCB_VERSION=14
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	'-DUSB_PRODUCT="diy_belt_tensioner"'
	'-DUSB_MANUFACTURER="OpenSource"'
	-DCORE_DEBUG_LEVEL=0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
