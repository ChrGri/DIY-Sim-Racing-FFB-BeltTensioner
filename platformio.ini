[platformio]
default_envs = ControlBoard_V6
extra_configs =
    platformio.envs/*.ini

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
monitor_speed = 250000
upload_speed = 921600
; All supported boards have (at least) 4 MB flash: ESP32-S3-Zero, LOLIN S3 Mini, PCBA,
; DevKits. The esp32-s3-devkitc-1 default of 8 MB does not boot on a 4 MB chip
; ("partition ... exceeds flash chip size"), a 4 MB image runs on larger chips too.
board_upload.flash_size = 4MB
board_build.partitions = partition_4M_customized.csv
lib_deps =
    https://github.com/gin66/FastAccelStepper.git
