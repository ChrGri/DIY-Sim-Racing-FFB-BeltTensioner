name: Build and Release Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - ControlBoard_V6
          - ControlBoard_V7
          - esp32_devkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('**/platformio*.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.environment }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware for ${{ matrix.environment }}
        run: |
          pio run -e ${{ matrix.environment }}

      - name: Package build artifacts
        run: |
          mkdir -p artifacts
          ENV_DIR=".pio/build/${{ matrix.environment }}"

          # Copy standalone binaries with environment name prefix
          if [ -f "$ENV_DIR/firmware.bin" ]; then
            cp "$ENV_DIR/firmware.bin" "artifacts/firmware_${{ matrix.environment }}.bin"
          fi
          if [ -f "$ENV_DIR/firmware.factory.bin" ]; then
            cp "$ENV_DIR/firmware.factory.bin" "artifacts/firmware_factory_${{ matrix.environment }}.bin"
          fi

          # Package all relevant bin files into a zip archive
          cd "$ENV_DIR"
          zip -j "$GITHUB_WORKSPACE/artifacts/DIY-Sim-Racing-FFB-BeltTensioner_${{ matrix.environment }}.zip" \
            firmware.bin \
            firmware.factory.bin \
            bootloader.bin \
            partitions.bin 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release (Main Branch)
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Version (YY.WW.DD)
        id: version
        run: |
          YEAR=$(date +'%y')
          WEEK=$(date +'%V')
          DOW=$(printf "%02d" $(date +'%u'))
          BASE_TAG="${YEAR}.${WEEK}.${DOW}"
          TAG="${BASE_TAG}"

          # If tag already exists, append incremental suffix (.1, .2, ...)
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            COUNT=1
            while git rev-parse "refs/tags/${BASE_TAG}.${COUNT}" >/dev/null 2>&1; do
              COUNT=$((COUNT + 1))
            done
            TAG="${BASE_TAG}.${COUNT}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: ${TAG}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
